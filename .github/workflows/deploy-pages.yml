name: Deploy Contest Calendar

on:
  schedule:
    - cron: "0 2 * * 1,4"   # 每周一、四 北京时间 10:00（每周2次）
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Run scraper (skip AI search to save API)
        working-directory: contests-scraper
        run: python scrape_all.py --skip-ai-search

      - name: Generate static HTML
        run: python contests-scraper/export_html.py

      - name: Commit and deploy
        run: |
          git config --global user.email "bot@ai-contests"
          git config --global user.name "AI Contest Bot"
          git add public/contests/
          git diff --cached --quiet || git commit -m "🤖 Update $(date +%Y-%m-%d)"
          git push

      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public/contests
      - uses: actions/deploy-pages@v4
