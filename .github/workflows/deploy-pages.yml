name: Scrape + Deploy + Sync to Feishu

on:
  schedule:
    - cron: "0 2 * * *"   # 每天北京时间 10:00
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Run scraper
        working-directory: contests-scraper
        run: python scrape_all.py --skip-ai-search

      - name: Generate static HTML
        run: python contests-scraper/export_html.py

      - name: Commit and push
        run: |
          git config --global user.email "bot@ai-contests"
          git config --global user.name "AI Contest Bot"
          git add public/contests/
          git diff --cached --quiet || git commit -m "🤖 Daily update $(date +%Y-%m-%d)"
          git push

      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public/contests
      - uses: actions/deploy-pages@v4

  sync-to-feishu:
    runs-on: ubuntu-latest
    needs: scrape-and-deploy
    if: ${{ secrets.BITABLE_APP_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Sync to Feishu Bitable
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          BITABLE_APP_TOKEN: ${{ secrets.BITABLE_APP_TOKEN }}
          BITABLE_TABLE_ID: ${{ secrets.BITABLE_TABLE_ID }}
        run: python contests-scraper/sync/feishu_sync.py
