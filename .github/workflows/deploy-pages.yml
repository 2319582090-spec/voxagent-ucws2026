name: Deploy Contest Calendar to GitHub Pages

on:
  schedule:
    - cron: "0 1 * * *"   # 每天 UTC 1:00 (北京时间 9:00)
    - cron: "0 13 * * *"  # 每天 UTC 13:00 (北京时间 21:00)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Run scraper
        working-directory: contests-scraper
        run: python scrape_all.py

      - name: Generate static HTML
        run: python contests-scraper/export_html.py

      - name: Commit updated data
        run: |
          git config --global user.email "bot@ai-contests"
          git config --global user.name "AI Contest Bot"
          git add public/contests/
          git diff --cached --quiet || git commit -m "🤖 Update contests $(date +%Y-%m-%d)"
          git push

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public/contests

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
