<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI赛事掘金</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#fff;--text:#1d1d1f;--sub:#86868b;--sep:#e5e5e7;
  --card:#f5f5f7;--accent:#0071e3;--red:#ff3b30;--orange:#ff9500;--gold:#bf8a00;
  --green:#34c759;--purple:#af52de;
}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}

/* Header */
.header{max-width:1600px;margin:0 auto;padding:48px 40px 0}
.header h1{font-size:36px;font-weight:700;letter-spacing:-0.5px;background:linear-gradient(135deg,#bf8a00,#ff9500);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header p{font-size:15px;color:var(--sub);margin-top:4px}
.stats{display:flex;gap:24px;margin-top:16px}
.stat{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub)}
.stat b{font-size:18px;font-weight:600;color:var(--text)}

/* Controls */
.controls{max-width:1600px;margin:0 auto;padding:20px 40px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.filters{display:flex;align-items:center;gap:6px}
.filters span{font-size:12px;color:var(--sub);margin-right:4px}
.filters button{padding:5px 14px;border-radius:20px;border:1.5px solid var(--sep);font-size:12px;font-weight:500;cursor:pointer;background:var(--bg);color:var(--sub);transition:.2s;letter-spacing:0.2px}
.filters button:hover{border-color:var(--accent);color:var(--accent)}
.filters button.active{background:var(--text);color:#fff;border-color:var(--text)}
.nav{display:flex;align-items:center;gap:8px}
.nav button{width:32px;height:32px;border-radius:8px;border:none;background:transparent;cursor:pointer;font-size:16px;color:var(--sub);display:flex;align-items:center;justify-content:center;transition:.15s}
.nav button:hover{background:var(--card)}
.nav .today-btn{width:auto;padding:4px 14px;font-size:13px;font-weight:500;color:var(--accent);border-radius:8px}

/* Calendar */
.calendar{max-width:1600px;margin:0 auto;padding:0 40px 60px}
.weekdays{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1.5px solid var(--sep)}
.weekdays div{text-align:center;font-size:12px;font-weight:600;color:var(--sub);padding:10px 0;text-transform:uppercase;letter-spacing:0.5px}
.grid{display:grid;grid-template-columns:repeat(7,1fr)}
.day{min-height:140px;border-right:1px solid #f0f0f2;border-bottom:1px solid #f0f0f2;padding:6px 8px;position:relative;transition:.15s}
.day:nth-child(7n+1){border-left:none}
.day:hover{background:#fafafc}
.day.other-month{background:#fafafa;opacity:.35}
.day .date-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.day .date-num{font-size:13px;font-weight:500;width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:50%;color:var(--text)}
.day .date-num.today{background:var(--accent);color:#fff;font-weight:600}
.day .date-num.weekend{color:var(--red)}
.day .count{font-size:10px;font-weight:600;color:#fff;background:var(--accent);min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px}

/* Contest cards */
.contest{display:block;text-decoration:none;margin-bottom:3px;padding:4px 6px;border-radius:6px;font-size:11px;line-height:1.35;cursor:pointer;transition:.15s;border:1px solid transparent}
.contest:hover{transform:translateY(-1px);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.contest.mega{background:linear-gradient(135deg,#fef9e7,#fef3c7);color:#92400e;border-color:#fde68a;font-weight:600}
.contest.big{background:#fef3c7;color:#92400e;border-color:#fde68a}
.contest.urgent{background:#fee2e2;color:#991b1b;border-color:#fecaca}
.contest.soon{background:#fff7ed;color:#9a3412;border-color:#fed7aa}
.contest.normal{background:var(--card);color:#4b5563;border-color:#e5e7eb}
.contest .name{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.contest .meta{display:flex;align-items:center;gap:6px;margin-top:1px;font-size:10px;opacity:.8}
.contest .prize-tag{font-weight:600}
.contest .cat-tag{padding:0 4px;border-radius:3px;font-size:9px;font-weight:500;background:rgba(0,0,0,.06)}

/* Legend */
.legend{max-width:1600px;margin:0 auto;padding:0 40px 24px;display:flex;align-items:center;gap:20px;font-size:11px;color:var(--sub)}
.legend .item{display:flex;align-items:center;gap:5px}
.legend .dot{width:14px;height:14px;border-radius:4px}

/* Modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:1000;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);animation:fadeIn .2s}
.modal-overlay.show{display:flex;align-items:center;justify-content:center}
.modal{background:var(--bg);border-radius:16px;max-width:560px;width:90%;max-height:80vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2);animation:slideUp .25s ease-out}
.modal-header{padding:24px 24px 0;display:flex;align-items:flex-start;justify-content:space-between}
.modal-header h2{font-size:20px;font-weight:600;line-height:1.3;flex:1;padding-right:16px}
.modal-close{width:28px;height:28px;border-radius:14px;border:none;background:var(--card);cursor:pointer;font-size:14px;color:var(--sub);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.modal-close:hover{background:#e5e5e7}
.modal-body{padding:16px 24px 24px}
.modal-body .row{display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px solid #f0f0f2}
.modal-body .row:last-child{border-bottom:none}
.modal-body .label{font-size:12px;color:var(--sub);min-width:60px;flex-shrink:0;padding-top:1px}
.modal-body .value{font-size:14px;font-weight:500;line-height:1.5}
.modal-body .value a{color:var(--accent);text-decoration:none}
.modal-body .value a:hover{text-decoration:underline}
.modal-body .badge-row{display:flex;gap:6px;flex-wrap:wrap}
.modal-body .badge{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:500}
.modal-body .badge.cat-dev{background:#e8f4fd;color:#0071e3}
.modal-body .badge.cat-hack{background:#fce8f4;color:#af52de}
.modal-body .badge.cat-video{background:#e8fde8;color:#248a3d}
.modal-body .badge.prize{background:#fef3c7;color:#92400e}
.modal-body .go-btn{display:inline-block;margin-top:16px;padding:10px 24px;background:var(--accent);color:#fff;border-radius:10px;font-size:14px;font-weight:500;text-decoration:none;transition:.15s}
.modal-body .go-btn:hover{background:#0077ed}

/* Footer */
.footer{max-width:1600px;margin:0 auto;padding:0 40px 40px;text-align:center;font-size:11px;color:#c7c7cc}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>

<div class="header">
  <h1>⛏️ AI赛事掘金</h1>
  <p>高奖金 AI 比赛 · 黑客松 · AI视频赛事日历</p>
  <div class="stats" id="stats"></div>
</div>

<div class="controls">
  <div class="filters" id="filters">
    <span>筛选：</span>
    <button class="active" data-filter="all">全部</button>
    <button data-filter="5000">≥ $5K</button>
    <button data-filter="50000">≥ $50K</button>
    <button data-filter="100000">≥ $100K</button>
    <button data-filter="500000">≥ $500K</button>
  </div>
  <div class="nav">
    <button class="today-btn" onclick="goToday()">今天</button>
    <button onclick="prevMonth()">‹</button>
    <button onclick="nextMonth()">›</button>
  </div>
</div>

<div class="calendar" id="calendar"></div>

<div class="legend">
  <div class="item"><div class="dot" style="background:linear-gradient(135deg,#fef9e7,#fde68a)"></div> ≥$100K 超高奖金</div>
  <div class="item"><div class="dot" style="background:#fee2e2"></div> ≤3天 紧急</div>
  <div class="item"><div class="dot" style="background:#fff7ed"></div> ≤7天 即将截止</div>
  <div class="item"><div class="dot" style="background:var(--card)"></div> 正常</div>
</div>

<div class="footer">
  <span id="update-time"></span> · 数据来自 Kaggle / 天池 / Devpost / 和鲸 / AI掘金 等平台 · 每周一/四自动更新
</div>

<!-- Modal -->
<div class="modal-overlay" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modal-title"></h2>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<script>
let DATA = [];
let currentMonth, currentYear;
let filterMin = 0;

const CAT_COLORS = {'AI开发':'cat-dev','AI黑客松':'cat-hack','AI视频':'cat-video'};

async function loadData() {
  try {
    const resp = await fetch('all.json');
    const json = await resp.json();
    DATA = json.contests || [];
    document.getElementById('update-time').textContent = '更新于 ' + new Date(json.updated_at).toLocaleString('zh-CN');
    renderStats(json);
  } catch(e) {
    // Inline data fallback - will be replaced at build time
    console.error('Failed to load data', e);
  }
  const now = new Date();
  currentYear = now.getFullYear();
  currentMonth = now.getMonth();
  render();
}

function renderStats(json) {
  const el = document.getElementById('stats');
  const total = json.total || DATA.length;
  const prize = json.total_prize_usd || 0;
  const cats = json.by_category || {};
  el.innerHTML = `
    <div class="stat"><b>${total}</b> 场赛事</div>
    <div class="stat"><b>$${(prize/1e6).toFixed(1)}M</b> 总奖金</div>
    ${Object.entries(cats).map(([k,v]) => `<div class="stat"><b>${v}</b> ${k}</div>`).join('')}
  `;
}

function render() {
  const container = document.getElementById('calendar');
  const today = new Date();
  today.setHours(0,0,0,0);
  
  const firstDay = new Date(currentYear, currentMonth, 1);
  const lastDay = new Date(currentYear, currentMonth + 1, 0);
  const startPad = (firstDay.getDay() + 6) % 7; // Mon=0
  const totalDays = lastDay.getDate();
  
  // Build contest map: date string -> contests
  const contestMap = {};
  DATA.forEach(c => {
    if (!c.deadline) return;
    if (filterMin > 0 && (c.prize_usd || 0) < filterMin) return;
    const d = c.deadline.substring(0, 10);
    if (!contestMap[d]) contestMap[d] = [];
    contestMap[d].push(c);
  });
  
  const monthLabel = `${currentYear}年${currentMonth + 1}月`;
  
  let html = `<div class="weekdays">`;
  ['一','二','三','四','五','六','日'].forEach(d => html += `<div>${d}</div>`);
  html += `</div><div class="grid">`;
  
  // Previous month padding
  const prevLast = new Date(currentYear, currentMonth, 0);
  for (let i = startPad - 1; i >= 0; i--) {
    const d = prevLast.getDate() - i;
    html += `<div class="day other-month"><div class="date-row"><span class="date-num">${d}</span></div></div>`;
  }
  
  // Current month
  for (let d = 1; d <= totalDays; d++) {
    const date = new Date(currentYear, currentMonth, d);
    const dateStr = `${currentYear}-${String(currentMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const contests = contestMap[dateStr] || [];
    const isToday = date.getTime() === today.getTime();
    const isWeekend = date.getDay() === 0 || date.getDay() === 6;
    
    let cls = 'day';
    let numCls = 'date-num' + (isToday ? ' today' : '') + (isWeekend && !isToday ? ' weekend' : '');
    
    html += `<div class="${cls}">`;
    html += `<div class="date-row"><span class="${numCls}">${d}</span>`;
    if (contests.length > 1) html += `<span class="count">${contests.length}</span>`;
    html += `</div>`;
    
    contests.forEach(c => {
      const dl = new Date(c.deadline);
      const daysLeft = Math.ceil((dl - today) / 86400000);
      let cardCls = 'normal';
      if ((c.prize_usd || 0) >= 100000) cardCls = 'mega';
      else if (daysLeft <= 3) cardCls = 'urgent';
      else if (daysLeft <= 7) cardCls = 'soon';
      else if ((c.prize_usd || 0) >= 10000) cardCls = 'big';
      
      const prizeText = c.prize ? c.prize.replace(/\s*\(.+\)/, '').substring(0, 16) : '';
      
      html += `<div class="contest ${cardCls}" onclick='showModal(${JSON.stringify(c).replace(/'/g,"&#39;")})' title="${c.title}">`;
      html += `<span class="name">${escHtml(c.title)}</span>`;
      html += `<span class="meta">`;
      if (prizeText) html += `<span class="prize-tag">${escHtml(prizeText)}</span>`;
      html += `<span class="cat-tag">${c.category||''}</span>`;
      html += `</span></div>`;
    });
    
    html += `</div>`;
  }
  
  // Next month padding
  const endPad = 7 - ((startPad + totalDays) % 7);
  if (endPad < 7) {
    for (let i = 1; i <= endPad; i++) {
      html += `<div class="day other-month"><div class="date-row"><span class="date-num">${i}</span></div></div>`;
    }
  }
  
  html += `</div>`;
  container.innerHTML = html;
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function showModal(c) {
  document.getElementById('modal-title').textContent = c.title;
  const catClass = CAT_COLORS[c.category] || 'cat-dev';
  let html = '';
  html += `<div class="badge-row">`;
  html += `<span class="badge ${catClass}">${c.category||'AI开发'}</span>`;
  if (c.prize) html += `<span class="badge prize">💰 ${escHtml(c.prize)}</span>`;
  html += `</div>`;
  html += `<div class="row"><span class="label">截止日期</span><span class="value">${c.deadline ? new Date(c.deadline).toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric'}) : '待确认'}</span></div>`;
  if (c.organizer) html += `<div class="row"><span class="label">主办方</span><span class="value">${escHtml(c.organizer)}</span></div>`;
  if (c.platform) html += `<div class="row"><span class="label">平台</span><span class="value">${escHtml(c.platform)}</span></div>`;
  if (c.url) html += `<div style="text-align:center"><a class="go-btn" href="${c.url}" target="_blank" rel="noopener">前往官网 →</a></div>`;
  document.getElementById('modal-body').innerHTML = html;
  document.getElementById('modal').classList.add('show');
}

function closeModal() {
  document.getElementById('modal').classList.remove('show');
}

function prevMonth() { currentMonth--; if(currentMonth<0){currentMonth=11;currentYear--} render(); }
function nextMonth() { currentMonth++; if(currentMonth>11){currentMonth=0;currentYear++} render(); }
function goToday() { const n=new Date(); currentYear=n.getFullYear(); currentMonth=n.getMonth(); render(); }

// Filter buttons
document.getElementById('filters').addEventListener('click', e => {
  if (e.target.tagName !== 'BUTTON') return;
  document.querySelectorAll('#filters button').forEach(b => b.classList.remove('active'));
  e.target.classList.add('active');
  filterMin = parseInt(e.target.dataset.filter || 0);
  render();
});

// Keyboard
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
  if (e.key === 'ArrowLeft') prevMonth();
  if (e.key === 'ArrowRight') nextMonth();
});

loadData();
</script>
</body>
</html>
